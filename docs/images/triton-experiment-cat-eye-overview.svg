<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2468a0"/></marker></defs><rect width="1600" height="1000" fill="#fff"/><text x="46" y="66" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Triton Hands-on Experiment — What It Teaches Us</text><text x="46" y="105" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">A CPU-only model-serving reference for future Cat-Eye technical discussions</text><rect x="24" y="144" width="1552" height="238" rx="20" fill="#f7fbff" stroke="#a3c8e7" stroke-width="2"/><text x="55" y="182" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">WHAT WE BUILT</text><rect x="52" y="210" width="267" height="124" rx="14" fill="#fff" stroke="#2c74ad" stroke-width="2"/><text x="185" y="249" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Windows</text><text x="185" y="288" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">SSH / PowerShell</text><path d="M321,273 L356,273" stroke="#2468a0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="359" y="210" width="267" height="124" rx="14" fill="#fff" stroke="#2c74ad" stroke-width="2"/><text x="492" y="249" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Azure Ubuntu VM</text><text x="492" y="288" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Docker runtime</text><path d="M628,273 L663,273" stroke="#2468a0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="666" y="210" width="267" height="124" rx="14" fill="#fff" stroke="#2c74ad" stroke-width="2"/><text x="799" y="249" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Triton Server</text><text x="799" y="288" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">HTTP V2 API</text><path d="M935,273 L970,273" stroke="#2468a0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="973" y="210" width="267" height="124" rx="14" fill="#fff" stroke="#2c74ad" stroke-width="2"/><text x="1106" y="249" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">ONNX Runtime</text><text x="1106" y="288" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">CPU backend</text><path d="M1242,273 L1277,273" stroke="#2468a0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1280" y="210" width="267" height="124" rx="14" fill="#fff" stroke="#2c74ad" stroke-width="2"/><text x="1413" y="249" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Output</text><text x="1413" y="288" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Boxes + JPEG</text><text x="800" y="366" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Versioned Model Repository: ssd_mobilenet_v1_12/config.pbtxt + 1/model.onnx</text><rect x="24" y="402" width="770" height="250" rx="18" fill="#fff" stroke="#b2cde5" stroke-width="2"/><text x="55" y="446" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">VALIDATED END-TO-END</text><text x="61" y="492" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">✓  Docker container + Triton model readiness (HTTP 200)</text><text x="61" y="526" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">✓  Python inference through HTTP V2 binary protocol</text><text x="61" y="560" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">✓  COCO label mapping and annotated dog JPEG</text><text x="61" y="594" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">✓  ONNX resize and normalization traced</text><text x="61" y="628" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">✓  A/B/C preprocessing comparison executed</text><rect x="811" y="402" width="765" height="250" rx="18" fill="#fff" stroke="#b2cde5" stroke-width="2"/><text x="842" y="446" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">KEY TECHNICAL FINDINGS</text><text x="852" y="492" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">•  ONNX graph already includes resize and normalization</text><text x="852" y="526" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">•  Input preprocessing changes predicted classes/scores</text><text x="852" y="560" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">•  Original vs Pillow-resized image behaved differently</text><text x="852" y="594" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">•  A/C asymmetric resize results closely matched</text><text x="852" y="628" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">•  One CPU instance reached ~36–37 requests/sec</text><rect x="24" y="671" width="770" height="258" rx="18" fill="#fff" stroke="#b2cde5" stroke-width="2"/><text x="55" y="710" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">OBSERVED BENCHMARK BASELINE</text><rect x="51" y="730" width="714" height="44" rx="4" fill="#edf5fc" stroke="#c9ddee" stroke-width="1"/><text x="77" y="758" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">Scenario</text><text x="408" y="758" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">Latency</text><text x="613" y="758" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">Throughput</text><rect x="52" y="777" width="710" height="33" fill="#f7fbfe"/><text x="77" y="801" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">300×300 sequential</text><text x="408" y="801" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">p50 27.6 ms</text><text x="613" y="801" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">35.5 RPS</text><text x="77" y="835" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Original resolution</text><text x="408" y="835" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">p50 43.9 ms</text><text x="613" y="835" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">22.2 RPS</text><rect x="52" y="845" width="710" height="33" fill="#f7fbfe"/><text x="77" y="869" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">2 concurrent clients</text><text x="408" y="869" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">mean 52.7 ms</text><text x="613" y="869" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">36.9 RPS</text><text x="77" y="903" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">4 concurrent clients</text><text x="408" y="903" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">mean 100.7 ms</text><text x="613" y="903" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">36.9 RPS</text><text x="55" y="915" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Exploratory CPU-only loopback results, not production SLAs</text><rect x="811" y="671" width="765" height="258" rx="18" fill="#fff" stroke="#b2cde5" stroke-width="2"/><text x="842" y="710" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">HOW THIS HELPS CAT-EYE</text><text x="852" y="753" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">•  Reusable model repository + versioned serving pattern</text><text x="852" y="787" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">•  Known input/output and preprocessing contracts</text><text x="852" y="821" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">•  API integration and client-side postprocessing example</text><text x="852" y="855" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">•  Baseline for profiling, batching and CPU/GPU trade-offs</text><text x="852" y="889" fill="#123961" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">•  Next: server stats, queue analysis, instance scaling</text><text x="800" y="973" fill="#4b6076" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Evidence: 13 Nov 2026  •  One CPU instance  •  D4-06/D4-07 exploratory benchmark</text></svg>